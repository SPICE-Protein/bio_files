[package]
name = "bio_files"
version = "0.5.3"
edition = "2024"
authors = ["David O'Connor <the_alchemist@fastmail.com>"]
description = "Save and load common biology file formats"
keywords = ["mol2", "sdf", "molecule", "biology"]
categories = [
    "science::bioinformatics::genomics",
    "science::bioinformatics::proteomics",
    "science::bioinformatics::sequence-analysis",
    "science::computational-biology::structural-modeling",
    "science::computational-chemistry::cheminformatics",
]
repository = "https://github.com/David-OConnor/bio_files"
documentation = "https://docs.rs/bio_files"
readme = "README.md"
license = "MIT"
exclude = [".gitignore"]


[dependencies]
byteorder = "1.5.0"  # For use with some parsers.
na_seq = "0.3.14"  # Element, atom etc primitives
bio_apis = { version = "0.2.3", optional = true } # Loading data from RCSB etc.
lin_alg = "1.3.13"
regex = "1.12.2"

# These are for converting 2fo-fc files to map (electron density)
#num-complex = "0.4.6"
#rustfft = "6.4.0"

bincode = { version = "2.0.1", optional = true }
rayon = "1.11.0"  # Optional [de]serializing

[patch.crates-io]
#na_seq = { path = "../na_seq" }
#lin_alg = { path = "../../lin_alg" }


[features]
# `network` gates the download-by-ID helpers (bio_apis → ureq/rustls/ring).
# Default ON: existing consumers keep identical resolution. Builds that must
# exclude native-TLS deps (e.g. wasm32) opt out with `default-features = false`.
default = ["network"]
encode = ["bincode"]
network = ["dep:bio_apis"]
